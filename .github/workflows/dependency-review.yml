name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Both commands resolve everything they report from the manifest and the
      # lockfile, so the dependency tree never has to be materialised on disk.
      - name: Check outdated dependencies
        continue-on-error: true
        run: pnpm outdated

      - name: Run pnpm audit
        run: pnpm audit
