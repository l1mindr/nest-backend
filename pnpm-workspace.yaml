allowBuilds:
  '@scarf/scarf': false
  argon2: true
  bcrypt: true
  # Optional native accelerator behind bullmq's msgpackr dependency. Left
  # unbuilt so installs need no toolchain; msgpackr falls back to its JS path.
  msgpackr-extract: false
overrides:
  '@compodoc/compodoc>@angular-devkit/schematics': 21.2.13
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf and
  # GHSA-jqff-g426-hqxp: host confusion and SSRF in fast-uri below 3.1.6.
  # Reached only transitively through ajv (commitlint, @nestjs/cli, eslint),
  # which asks for ^3.0.1 — so this is pinned inside the 3.x line rather than
  # to the latest 4.x, which would fall outside that range.
  fast-uri: ^3.1.6
