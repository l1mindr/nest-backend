services:
  migration:
    # Named explicitly so CI can build the image once, with a layer cache, and
    # have Compose reuse it instead of running a second build of its own.
    image: nest-backend-e2e-migration

    build:
      context: ../../..

    environment:
      NODE_ENV: production

      DATA_SOURCE_HOST: postgres
      DATA_SOURCE_PORT: 5432
      DATA_SOURCE_USERNAME: postgres
      DATA_SOURCE_PASSWORD: postgres
      DATA_SOURCE_DATABASE: test_e2e_db

    depends_on:
      postgres:
        condition: service_healthy

    command: npm run migration:run
    init: true

  app:
    image: nest-backend-e2e-app

    build:
      context: ../../..
      target: test

    environment:
      NODE_ENV: test

      DATA_SOURCE_HOST: postgres
      DATA_SOURCE_PORT: 5432
      DATA_SOURCE_USERNAME: postgres
      DATA_SOURCE_PASSWORD: postgres
      DATA_SOURCE_DATABASE: test_e2e_db

      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAX_ACTIVE_SESSIONS: 10
      LOG_LEVEL: error
      # REDIS_PASSWORD: ''
      # REDIS_DB: 0

      # Pinned rather than left to the config default so the parallelism this
      # lane runs at is visible next to the resources it runs against, and so a
      # future change to the default cannot quietly re-break CI.
      #
      # Each worker is a full Nest app and Node sizes its heap from total host
      # memory, so ~1.9 GB per worker: 2 peaks near 3.9 GB, which fits a GitHub
      # Actions standard runner (2 vCPU / 7 GB) alongside the four service
      # containers. At 4 the kernel starts SIGKILLing workers mid-`beforeAll`.
      # See the comment in jest.e2e.config.ts for the measurements.
      E2E_MAX_WORKERS: 2

      MONGODB_URI: mongodb://mongo:27017
      # worker-env.ts derives one database per Jest worker from this base name.
      MONGODB_DATABASE: test_e2e_logs

      ACCESS_TOKEN_SECRET: 3SGh4K6nRjy3rUiEZcwMaG4xZFyObMdJ
      REFRESH_TOKEN_SECRET: juQXiRL05Isuon4mhjdwwwd4lUCaEc4Z
      CSRF_TOKEN_SECRET: Py2RzgyepufR9xQD

      # Mailpit, not Gmail. The specs under test/email/ deliver over real SMTP
      # and read the message back, so the suite needs a server that accepts one
      # — and must not have one that could reach a real recipient. These
      # override `.env.test`, which names the host-published ports instead.
      #
      # `senderOf`/subject assertions read EMAIL_FROM and APP_NAME back out of
      # the environment, so both are set explicitly rather than left to a
      # schema default.
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
      EMAIL_SECURE: 'false'
      EMAIL_USER: dashboard-e2e@mailpit.test
      EMAIL_APP_PASSWORD: mailpit-accepts-any-password
      EMAIL_FROM: Dashboard E2E <no-reply@mailpit.test>
      APP_NAME: Dashboard E2E
      # Read by test/helpers/mailpit.helper.ts only.
      MAILPIT_API_URL: http://mailpit:8025

      CORS_ORIGIN: http://localhost:4321

    depends_on:
      migration:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      mongo:
        condition: service_healthy

      mailpit:
        condition: service_healthy

    # The E2E suite is compiled on the fly by ts-jest and imports from `src`,
    # so it never reads `dist`. Building first only added a redundant compile.
    command: pnpm run test:e2e

  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: test_e2e_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - '5433:5432'

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d test_e2e_db']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

    ports:
      - '6380:6379'

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # The SMTP server the delivered-email specs send to and then read back.
  #
  # Mailpit stores what it accepts and has no upstream: relaying and forwarding
  # are opt-in flags and none are set, so a message that reaches it cannot leave
  # for the Internet. That is what makes it safe to point a CI job's email at.
  #
  # Not published to the host — CI reaches it as `mailpit` on the Compose
  # network, and the run is the only thing that should be reading this mailbox.
  mailpit:
    image: axllent/mailpit:v1.28

    environment:
      # The transport authenticates because the production provider requires
      # it; Mailpit takes any credentials so that the tested code path stays
      # the production one.
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_QUIET: 'true'

    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    # The official mongo image has no alpine variant; 7.x is jammy-based.
    image: mongo:7-jammy

    ports:
      - '27018:27017'

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" | grep 1'
        ]
      interval: 5s
      timeout: 3s
      retries: 20
